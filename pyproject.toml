[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automixer"
version = "1.0.0"
description = "AutoMixer - Mezcla local de stems de cancion"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
]

[project.scripts]
automixer = "src.app:main"

[tool.setuptools.packages.find]
include = ["src*"]
